version: 2
updates:
  # Rust dependencies: one grouped pull request a week for minor and patch
  # updates, and one per major update.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Titles like `chore(deps): bump …`, which the PR title check accepts and
    # release-plz lists under Dependencies.
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
  # GitHub Actions are left out on purpose: release.yml is generated by
  # cargo-dist, which pins its own action versions, and an edited copy fails
  # its check. Upgrade them with `dist init`, and the other workflows by hand.
