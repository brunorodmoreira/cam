name: Claude Code Review

# Claude reviews a pull request when it's opened or marked ready, and
# comments. The review is advisory: main's ruleset doesn't require it. It
# stops early once Claude has commented on the pull request, so later pushes
# start no review; comment @claude to ask for another look.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # The action fails on pull requests opened by bots (release-plz's release
    # pull requests and Dependabot's), so they're skipped here. It skips pull
    # requests from forks on its own, since they get no secrets.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # The action sets up its own token for git.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
