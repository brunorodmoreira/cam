name: Publish to crates.io

# Called by release.yml (cargo-dist's release workflow) once a release's
# archives are built and uploaded. It publishes with crates.io's trusted
# publishing: crates.io checks that the token request comes from this
# repo's release.yml, so no crates.io token is stored anywhere.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
