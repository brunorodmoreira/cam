name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The check names, macOS and Linux, are what main's ruleset requires.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel: GitHub's arm64 macOS runners are short of capacity, and a
          # job that waits 15 minutes for one is cancelled. The tests don't
          # depend on the processor.
          - name: macOS
            runner: macos-15-intel
          - name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The tests run `cam init` in a real bash and zsh. macOS has both.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
