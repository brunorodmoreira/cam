[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Unix only: cam doesn't build for Windows.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where the shell installer puts cam: Claude Code's installer already has it on PATH
install-path = "~/.local/bin/"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A custom GitHub repo to publish the Homebrew formula to
tap = "brunorodmoreira/homebrew-tap"
# The formula's name: `brew install brunorodmoreira/tap/cam`
formula = "cam"
# Publish jobs to run in CI. crates.io isn't one: release-plz publishes the
# crate before it pushes the tag that starts this release.
publish-jobs = ["homebrew"]

# Build for Apple Silicon on an Intel runner: GitHub's arm64 macOS runners are
# short of capacity, and a build that waits 15 minutes for one is cancelled.
[dist.github-custom-runners]
aarch64-apple-darwin = { runner = "macos-15-intel", host = "x86_64-apple-darwin" }
