[package]
# The crate `cam` is taken on crates.io, so the package is `cam-cli` and the binary is `cam`.
name = "cam-cli"
version = "0.1.0"
edition = "2024"
description = "Pick the Claude Code account per folder via .claude-account files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brunorodmoreira/cam"
homepage = "https://github.com/brunorodmoreira/cam"
readme = "README.md"
keywords = ["claude", "claude-code", "accounts", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "CLAUDE.md", "dist-workspace.toml", "docs/demo.gif", "docs/demo/", "release-plz.toml"]

[[bin]]
name = "cam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
dialoguer = { version = "0.12.0", default-features = false }
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
