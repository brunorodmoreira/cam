[package]
# The crate `cam` is taken on crates.io, so the package is `cam-cli` and the binary is `cam`.
name = "cam-cli"
version = "0.1.0"
edition = "2024"
description = "Pick the Claude Code account per folder via .claude-account files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brunorodmoreira/cam"
publish = false

[features]
# Compiles in the file-based test store selected by CAM_TEST_STORE. Only for tests:
# `cargo test` turns it on through the self dev-dependency below.
test-store = []

[[bin]]
name = "cam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
# Self-reference so `cargo test` builds the binary with the test store; normal,
# release and `cargo install` builds don't get it.
cam-cli = { path = ".", features = ["test-store"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
